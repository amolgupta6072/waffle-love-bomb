<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FUTBIN Draft</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">FUT<span>DRAFT</span></div>
    <div class="meters" id="meters" hidden>
      <div class="meter"><label>Rating</label><b id="m-rating">0</b></div>
      <div class="meter"><label>Chemistry</label><b id="m-chem">0</b><small>/33</small></div>
      <div class="meter"><label>Picks</label><b id="m-picks">0</b><small id="m-picks-total">/0</small></div>
    </div>
    <div class="actions">
      <button id="btn-new" class="ghost" hidden>New draft</button>
      <button id="btn-finish" hidden>Play draft</button>
    </div>
  </header>

  <main id="app">
    <section id="screen-start" class="screen center">
      <h1>Build your draft squad</h1>
      <p class="muted">Pick a formation, a captain, then choose 1 of 5 players for every position, every sub and every reserve.</p>
      <p id="data-status" class="muted small"></p>
      <button id="btn-start" class="big" disabled>Start draft</button>
    </section>

    <section id="screen-draft" class="screen" hidden>
      <div class="board">
        <div class="pitch" id="pitch"></div>
        <aside class="bench">
          <h3>Substitutes</h3>
          <div class="bench-row" id="subs"></div>
          <h3>Reserves</h3>
          <div class="bench-row" id="reserves"></div>
          <p class="muted small hint">Click an empty slot to pick. Click two players to swap them.</p>
        </aside>
      </div>
    </section>

    <section id="screen-results" class="screen center" hidden></section>
  </main>

  <div class="modal" id="picker" hidden>
    <div class="modal-box">
      <h2 id="picker-title">Pick a player</h2>
      <div class="choices" id="choices"></div>
    </div>
  </div>

  <script src="data/players.js" onerror="void 0"></script>
  <script src="js/app.js"></script>
</body>
</html>
