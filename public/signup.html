<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up · lynq</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <a class="logo" href="/"><span class="logo-mark">⌁</span>lynq</a>
      <h1>Create your lynq</h1>
      <p class="sub">Free forever. Takes less than a minute.</p>
      <div class="alert" id="error" role="alert" hidden></div>
      <form id="signup-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <div class="input-prefix">
            <span>lynq/</span>
            <input id="username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="30" autocapitalize="none" spellcheck="false">
          </div>
          <div class="hint" id="username-hint" aria-live="polite"></div>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8">
          <div class="hint">At least 8 characters.</div>
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit">Create account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
    </div>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/signup.js"></script>
</body>
</html>
