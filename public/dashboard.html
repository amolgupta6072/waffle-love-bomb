<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · lynq</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="dash-nav">
    <div class="nav">
      <a class="logo" href="/dashboard"><span class="logo-mark">⌁</span><span class="hide-sm">lynq</span></a>
      <div class="share">
        <a id="share-link" href="#" target="_blank" rel="noopener"></a>
        <button class="btn btn-primary btn-sm" id="copy-link" type="button">Copy</button>
      </div>
      <div class="nav-actions">
        <button class="btn btn-ghost btn-sm" id="logout" type="button">Log out</button>
      </div>
    </div>
  </header>

  <main class="dash">
    <div>
      <section class="stats" aria-label="Analytics">
        <div class="stat"><div class="label">Page views</div><div class="value" id="stat-views">0</div></div>
        <div class="stat"><div class="label">Link clicks</div><div class="value" id="stat-clicks">0</div></div>
        <div class="stat"><div class="label">Click rate</div><div class="value" id="stat-ctr">0%</div></div>
      </section>

      <section class="card">
        <h2>Links <small id="link-count"></small></h2>
        <form class="add-link" id="add-link-form">
          <label class="sr-only" for="new-title">Title</label>
          <input id="new-title" name="title" type="text" placeholder="Title (e.g. My portfolio)" maxlength="100" required>
          <label class="sr-only" for="new-url">URL</label>
          <input id="new-url" name="url" type="text" inputmode="url" placeholder="https://…" required>
          <button class="btn btn-primary" type="submit">Add link</button>
        </form>
        <ul class="links-list" id="links"></ul>
        <div class="empty-state" id="links-empty" hidden>No links yet. Add your first one above ☝️</div>
      </section>

      <section class="card">
        <h2>Profile</h2>
        <form id="profile-form">
          <div class="field">
            <label for="display_name">Display name</label>
            <input id="display_name" name="display_name" type="text" maxlength="60">
          </div>
          <div class="field">
            <label for="bio">Bio</label>
            <textarea id="bio" name="bio" maxlength="280" rows="3" placeholder="Tell people what you're about"></textarea>
            <div class="hint" id="bio-count"></div>
          </div>
          <div class="field">
            <label for="avatar_url">Avatar image URL <span class="hint">(optional)</span></label>
            <input id="avatar_url" name="avatar_url" type="text" inputmode="url" placeholder="https://…/me.jpg">
          </div>
          <button class="btn btn-primary" type="submit">Save profile</button>
        </form>
      </section>

      <section class="card">
        <h2>Appearance</h2>
        <div class="themes" id="themes" role="group" aria-label="Theme"></div>
      </section>

      <section class="card">
        <h2>Account</h2>
        <p class="hint" id="account-email" style="margin-top:0"></p>
        <button class="btn btn-danger btn-sm" id="delete-account" type="button">Delete account</button>
      </section>
    </div>

    <aside class="preview" aria-label="Live preview">
      <div class="phone"><iframe id="preview" title="Your lynq page preview"></iframe></div>
      <p class="preview-label">Live preview</p>
    </aside>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <template id="link-template">
    <li class="link-item" draggable="true">
      <span class="handle" title="Drag to reorder" aria-hidden="true">⋮⋮</span>
      <div class="link-main">
        <div class="link-title"></div>
        <div class="link-url"></div>
        <div class="link-meta"></div>
      </div>
      <div class="link-actions">
        <button class="icon-btn" data-action="up" type="button" aria-label="Move up">↑</button>
        <button class="icon-btn" data-action="down" type="button" aria-label="Move down">↓</button>
        <button class="icon-btn" data-action="edit" type="button" aria-label="Edit">✎</button>
        <label class="switch" title="Show on page">
          <input type="checkbox" data-action="toggle" aria-label="Show on page">
          <span class="slider"></span>
        </label>
        <button class="icon-btn danger" data-action="delete" type="button" aria-label="Delete">🗑</button>
      </div>
    </li>
  </template>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
