name: Screenshot reference websites

on:
  workflow_dispatch:
  push:
    branches: [claude/lynq-website-1dqqw4]
    paths:
      - scripts/screenshot-references.mjs
      - .github/workflows/screenshot-references.yml

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Take screenshots
        run: node scripts/screenshot-references.mjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/reference
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Add reference website screenshots"
          git pull --rebase
          git push
